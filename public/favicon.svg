<!-- =========================================================
     TNI BRAND FAVICON
     White TNI + blue growth bars + magenta/green bullish arrow
     ========================================================= -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061B35"/>
      <stop offset="100%" stop-color="#0A3D78"/>
    </linearGradient>

    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1357E8"/>
      <stop offset="100%" stop-color="#29C5FF"/>
    </linearGradient>

    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#D000E8"/>
      <stop offset="48%" stop-color="#B82BE2"/>
      <stop offset="72%" stop-color="#45D782"/>
      <stop offset="100%" stop-color="#20F56B"/>
    </linearGradient>
  </defs>

  <!-- TNI FAVICON: BACKGROUND -->
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>

  <!-- TNI FAVICON: LETTERMARK -->
  <text
    x="5"
    y="39"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="25"
    font-weight="800"
    letter-spacing="-2"
  >TNI</text>

  <!-- TNI FAVICON: ASCENDING MARKET BARS -->
  <rect x="42" y="35" width="4" height="11" rx="1" fill="url(#bars)"/>
  <rect x="48" y="29" width="4" height="17" rx="1" fill="url(#bars)"/>
  <rect x="54" y="22" width="4" height="24" rx="1" fill="url(#bars)"/>

  <!-- TNI FAVICON: BULLISH / POSITIVE-IMPACT ARROW -->
  <path
    d="M41 43
       C47 40 52 35 56 28
       L59 22"
    fill="none"
    stroke="url(#arrow)"
    stroke-width="3.2"
    stroke-linecap="round"
  />

  <path
    d="M54.5 23 L60 20 L60 26"
    fill="none"
    stroke="#20F56B"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

</svg>
