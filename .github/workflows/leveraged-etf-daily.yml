name: Update Leveraged ETF Daily Data
on:
  workflow_dispatch:
    inputs:
      metadata:
        description: 'Also refresh AUM and expense ratios (slower)'
        type: boolean
        default: true
  schedule:
    # Daily at 23:30 UTC (18:30 EST / 19:30 EDT); GitHub may start later.
    - cron: '30 23 * * *'
concurrency:
  group: leveraged-etf-daily-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-leveraged-etf.txt
      - run: pip install -r scripts/requirements-leveraged-etf.txt
      - name: Update Yahoo research snapshot
        run: python scripts/update_leveraged_etf_data.py --project . --metadata
      - name: Update SNXX hourly weekday returns
        run: |
          if ! python scripts/generate-snxx-hourly-returns.py --project .; then
            echo '::warning::SNXX refresh failed; preserving its previous data and continuing the ETF update.'
            git restore -- src/data/charts/snxxHourlyWeekdayReturns.json
          fi

      - name: Commit snapshot if changed
        run: |
          git add src/pages/leveraged-etf-daily-metrics.json
          git add src/data/charts/snxxHourlyWeekdayReturns.json
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: update leveraged ETF daily snapshot'
          # Incorporate unrelated automated commits without forcing a push.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
